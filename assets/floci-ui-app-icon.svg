<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Floci UI app icon</title>
  <desc id="desc">A warm floccus cloud above a compact desktop dashboard on a dark technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="0.52" stop-color="#111631"/>
      <stop offset="1" stop-color="#070a13"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="50%" cy="33%" r="48%">
      <stop offset="0" stop-color="#f8c44f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f8c44f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="69%" cy="73%" r="44%">
      <stop offset="0" stop-color="#28d9c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#28d9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud-main" x1="300" y1="208" x2="702" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="0.58" stop-color="#ffd86c"/>
      <stop offset="1" stop-color="#e7a90f"/>
    </linearGradient>
    <linearGradient id="cloud-shadow" x1="334" y1="390" x2="690" y2="494" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4bd2c"/>
      <stop offset="1" stop-color="#b87908"/>
    </linearGradient>
    <linearGradient id="window" x1="256" y1="504" x2="768" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2448"/>
      <stop offset="1" stop-color="#0c1228"/>
    </linearGradient>
    <linearGradient id="panel" x1="304" y1="594" x2="720" y2="746" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18234a"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#4050a8" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="icon-mask">
      <rect x="48" y="48" width="928" height="928" rx="220"/>
    </clipPath>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="cloud-lift" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#120b02" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#bg)"/>
    <g clip-path="url(#icon-mask)">
      <rect x="48" y="48" width="928" height="928" fill="url(#grid)"/>
      <rect x="48" y="48" width="928" height="928" fill="url(#amber-glow)"/>
      <rect x="48" y="48" width="928" height="928" fill="url(#cyan-glow)"/>
      <circle cx="512" cy="354" r="294" fill="none" stroke="#5364db" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="512" cy="354" r="370" fill="none" stroke="#5364db" stroke-opacity="0.09" stroke-width="2"/>
      <path d="M200 769C331 691 488 676 824 715" fill="none" stroke="#2bd9c6" stroke-opacity="0.14" stroke-width="3"/>
    </g>
  </g>

  <g filter="url(#cloud-lift)">
    <rect x="315" y="330" width="392" height="132" rx="66" fill="url(#cloud-shadow)"/>
    <circle cx="350" cy="324" r="78" fill="url(#cloud-shadow)"/>
    <circle cx="444" cy="281" r="104" fill="url(#cloud-main)"/>
    <circle cx="558" cy="292" r="94" fill="url(#cloud-main)"/>
    <circle cx="661" cy="336" r="70" fill="url(#cloud-shadow)"/>
    <ellipse cx="514" cy="298" rx="139" ry="54" fill="#fff9e7" opacity="0.58"/>
    <circle cx="398" cy="292" r="14" fill="#fff9e7" opacity="0.82"/>
    <circle cx="485" cy="245" r="16" fill="#fff9e7" opacity="0.74"/>
    <circle cx="574" cy="260" r="13" fill="#fff9e7" opacity="0.72"/>
    <circle cx="648" cy="318" r="12" fill="#fff9e7" opacity="0.62"/>
  </g>

  <g opacity="0.86">
    <path d="M512 467V528" stroke="#ffd86c" stroke-width="9" stroke-linecap="round"/>
    <path d="M421 485L365 556" stroke="#28d9c4" stroke-width="7" stroke-linecap="round"/>
    <path d="M604 485L661 556" stroke="#6d7cff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="234" y="526" width="556" height="300" rx="48" fill="url(#window)" stroke="#5261c9" stroke-opacity="0.42" stroke-width="3"/>
    <rect x="266" y="566" width="492" height="42" rx="21" fill="#0b1024" stroke="#35439c" stroke-opacity="0.52" stroke-width="2"/>
    <circle cx="302" cy="587" r="8" fill="#ffcf62"/>
    <circle cx="330" cy="587" r="8" fill="#28d9c4"/>
    <circle cx="358" cy="587" r="8" fill="#8b94ff"/>
    <rect x="300" y="636" width="178" height="144" rx="30" fill="url(#panel)" stroke="#33408b" stroke-opacity="0.64" stroke-width="2"/>
    <rect x="520" y="636" width="204" height="144" rx="30" fill="url(#panel)" stroke="#33408b" stroke-opacity="0.64" stroke-width="2"/>
    <rect x="330" y="668" width="80" height="16" rx="8" fill="#ffd86c"/>
    <rect x="330" y="704" width="112" height="12" rx="6" fill="#5c69dc" opacity="0.72"/>
    <rect x="330" y="734" width="86" height="12" rx="6" fill="#28d9c4" opacity="0.82"/>
    <rect x="552" y="668" width="135" height="14" rx="7" fill="#6271ee"/>
    <rect x="552" y="704" width="96" height="12" rx="6" fill="#ffd86c" opacity="0.9"/>
    <rect x="552" y="734" width="124" height="12" rx="6" fill="#28d9c4" opacity="0.72"/>
  </g>
</svg>
