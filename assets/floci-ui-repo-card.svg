    <rect x="412" y="544" width="176" height="38" rx="19" fill="#172044" stroke="#5261c9" stroke-opacity="0.55"/>
    <text x="500" y="568" text-anchor="middle" fill="#b8c1ff">Service inventory</text>
  </g>

