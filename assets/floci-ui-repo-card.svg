<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Floci UI repository image</title>
  <desc id="desc">Repository social preview artwork for Floci UI, inspired by Floci's cloud motif and tailored to a desktop console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="0.48" stop-color="#121832"/>
      <stop offset="1" stop-color="#070a13"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="37%" cy="31%" r="42%">
      <stop offset="0" stop-color="#f8c44f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f8c44f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="70%" cy="71%" r="44%">
      <stop offset="0" stop-color="#28d9c4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#28d9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="151" y1="140" x2="487" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="0.58" stop-color="#ffd86c"/>
      <stop offset="1" stop-color="#e7a90f"/>
    </linearGradient>
    <linearGradient id="cloud-shadow" x1="170" y1="266" x2="492" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4bd2c"/>
      <stop offset="1" stop-color="#b87908"/>
    </linearGradient>
    <linearGradient id="card" x1="676" y1="128" x2="1165" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2449"/>
      <stop offset="1" stop-color="#0c1127"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#4050a8" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#amber-glow)"/>
  <rect width="1280" height="640" fill="url(#cyan-glow)"/>
  <circle cx="342" cy="248" r="276" fill="none" stroke="#5364db" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="342" cy="248" r="344" fill="none" stroke="#5364db" stroke-opacity="0.08" stroke-width="1.5"/>
  <path d="M75 540C225 463 460 430 783 469C945 489 1076 486 1209 444" fill="none" stroke="#2bd9c6" stroke-opacity="0.12" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="170" y="273" width="342" height="104" rx="52" fill="url(#cloud-shadow)"/>
    <circle cx="196" cy="263" r="65" fill="url(#cloud-shadow)"/>
    <circle cx="272" cy="224" r="88" fill="url(#cloud)"/>
    <circle cx="375" cy="234" r="80" fill="url(#cloud)"/>
    <circle cx="466" cy="272" r="58" fill="url(#cloud-shadow)"/>
    <ellipse cx="333" cy="231" rx="126" ry="48" fill="#fff9e7" opacity="0.58"/>
    <circle cx="237" cy="224" r="12" fill="#fff9e7" opacity="0.82"/>
    <circle cx="313" cy="184" r="14" fill="#fff9e7" opacity="0.74"/>
    <circle cx="391" cy="194" r="12" fill="#fff9e7" opacity="0.72"/>
  </g>

  <text x="116" y="460" fill="#fff8df" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="0">Floci UI</text>
  <text x="122" y="510" fill="#b8c1ff" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="0">A Rust desktop console for the local Floci AWS emulator</text>

  <g font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="122" y="544" width="116" height="38" rx="19" fill="#18234a" stroke="#5261c9" stroke-opacity="0.55"/>
    <text x="180" y="568" text-anchor="middle" fill="#ffd86c">Local-first</text>
    <rect x="254" y="544" width="142" height="38" rx="19" fill="#142b3a" stroke="#2bd9c6" stroke-opacity="0.48"/>
