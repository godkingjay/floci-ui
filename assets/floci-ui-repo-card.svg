    <rect x="878" y="214" width="238" height="92" rx="22" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="878" y="330" width="110" height="114" rx="22" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="1006" y="330" width="110" height="114" rx="22" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="756" y="248" width="66" height="12" rx="6" fill="#ffd86c"/>
    <rect x="756" y="287" width="48" height="10" rx="5" fill="#28d9c4"/>
    <rect x="756" y="323" width="70" height="10" rx="5" fill="#6d7cff"/>
    <rect x="756" y="359" width="56" height="10" rx="5" fill="#5968e6" opacity="0.72"/>
    <rect x="910" y="244" width="92" height="12" rx="6" fill="#ffd86c"/>
    <rect x="910" y="270" width="164" height="10" rx="5" fill="#5968e6" opacity="0.72"/>
    <rect x="910" y="364" width="52" height="12" rx="6" fill="#28d9c4"/>
    <rect x="910" y="392" width="42" height="9" rx="4.5" fill="#6170eb" opacity="0.74"/>
    <rect x="1038" y="364" width="52" height="12" rx="6" fill="#ffd86c"/>
    <rect x="1038" y="392" width="42" height="9" rx="4.5" fill="#28d9c4" opacity="0.74"/>
  </g>

  <text x="932" y="554" fill="#5364db" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">TAURI 2 / LEPTOS / LOCALHOST:4566</text>
</svg>
