<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Floci UI README banner</title>
  <desc id="desc">Floci UI brand banner with a warm floccus cloud mark and a compact desktop dashboard preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="0.55" stop-color="#121832"/>
      <stop offset="1" stop-color="#080b15"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="26%" cy="31%" r="44%">
      <stop offset="0" stop-color="#f8c44f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f8c44f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="77%" cy="55%" r="42%">
      <stop offset="0" stop-color="#28d9c4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#28d9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="86" y1="68" x2="276" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="0.6" stop-color="#ffd86c"/>
      <stop offset="1" stop-color="#e7a90f"/>
    </linearGradient>
    <linearGradient id="cloud-shadow" x1="94" y1="148" x2="286" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4bd2c"/>
      <stop offset="1" stop-color="#b87908"/>
    </linearGradient>
    <linearGradient id="card" x1="700" y1="58" x2="1160" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2449"/>
      <stop offset="1" stop-color="#0c1127"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#4050a8" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#amber-glow)"/>
  <rect width="1280" height="360" fill="url(#cyan-glow)"/>
  <circle cx="214" cy="156" r="174" fill="none" stroke="#5364db" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="214" cy="156" r="228" fill="none" stroke="#5364db" stroke-opacity="0.08" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="82" y="71" width="210" height="210" rx="52" fill="#10162c" stroke="#5364db" stroke-opacity="0.38" stroke-width="2"/>
    <g transform="translate(187 176) scale(0.82) translate(-187 -176)">
      <rect x="108" y="159" width="158" height="54" rx="27" fill="url(#cloud-shadow)"/>
      <circle cx="126" cy="156" r="33" fill="url(#cloud-shadow)"/>
      <circle cx="164" cy="134" r="45" fill="url(#cloud)"/>
      <circle cx="217" cy="140" r="41" fill="url(#cloud)"/>
      <circle cx="258" cy="163" r="30" fill="url(#cloud-shadow)"/>
      <ellipse cx="195" cy="141" rx="64" ry="25" fill="#fff9e7" opacity="0.54"/>
      <path d="M187 213V238" stroke="#ffd86c" stroke-width="5" stroke-linecap="round"/>
      <path d="M153 218L128 246" stroke="#28d9c4" stroke-width="4" stroke-linecap="round"/>
      <path d="M222 218L249 246" stroke="#6d7cff" stroke-width="4" stroke-linecap="round"/>
      <rect x="119" y="238" width="136" height="40" rx="14" fill="#172044" stroke="#4b59c5" stroke-opacity="0.45"/>
      <rect x="137" y="252" width="38" height="6" rx="3" fill="#ffd86c"/>
      <rect x="187" y="252" width="45" height="6" rx="3" fill="#28d9c4"/>
      <rect x="137" y="265" width="72" height="5" rx="2.5" fill="#6370e8" opacity="0.78"/>
    </g>
  </g>

  <text x="372" y="128" fill="#fff8df" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="0">Floci UI</text>
  <text x="375" y="171" fill="#b8c1ff" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="0">Local Floci desktop console</text>
  <text x="375" y="202" fill="#7683d8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" letter-spacing="0">Inspect services, resources, and health.</text>
  <text x="375" y="224" fill="#7683d8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" letter-spacing="0">Endpoint checks stay on localhost.</text>

  <g font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="375" y="246" width="86" height="32" rx="16" fill="#18234a" stroke="#5261c9" stroke-opacity="0.55"/>
    <text x="418" y="267" text-anchor="middle" fill="#ffd86c">Tauri 2</text>
    <rect x="474" y="246" width="88" height="32" rx="16" fill="#142b3a" stroke="#2bd9c6" stroke-opacity="0.48"/>
    <text x="518" y="267" text-anchor="middle" fill="#7ff0df">Leptos</text>
    <rect x="575" y="246" width="143" height="32" rx="16" fill="#172044" stroke="#5261c9" stroke-opacity="0.55"/>
    <text x="646" y="267" text-anchor="middle" fill="#b8c1ff">localhost:4566</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="743" y="72" width="444" height="228" rx="28" fill="url(#card)" stroke="#5364db" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="768" y="97" width="394" height="34" rx="17" fill="#0a0f23" stroke="#34409a" stroke-opacity="0.48"/>
    <circle cx="795" cy="114" r="6" fill="#ffcf62"/>
    <circle cx="817" cy="114" r="6" fill="#28d9c4"/>
    <circle cx="839" cy="114" r="6" fill="#8b94ff"/>
    <rect x="777" y="151" width="100" height="124" rx="20" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="898" y="151" width="244" height="56" rx="18" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="898" y="223" width="112" height="52" rx="18" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="1030" y="223" width="112" height="52" rx="18" fill="#121a36" stroke="#33408b" stroke-opacity="0.6"/>
    <rect x="801" y="176" width="51" height="10" rx="5" fill="#ffd86c"/>
    <rect x="801" y="203" width="43" height="8" rx="4" fill="#28d9c4"/>
    <rect x="801" y="228" width="54" height="8" rx="4" fill="#6d7cff"/>
    <rect x="923" y="174" width="92" height="10" rx="5" fill="#ffd86c"/>
    <rect x="923" y="190" width="176" height="8" rx="4" fill="#5968e6" opacity="0.72"/>
    <rect x="923" y="239" width="58" height="9" rx="4.5" fill="#28d9c4"/>
    <rect x="1055" y="239" width="55" height="9" rx="4.5" fill="#ffd86c"/>
  </g>
</svg>
