[package]
name = "floci-ui-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tauri backend for the Floci desktop UI"
license = "MIT"

[lib]
name = "floci_ui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aws-credential-types = "1"
aws-sdk-acm = "1"
aws-sdk-apigateway = "1"
aws-sdk-apigatewayv2 = "1"
aws-sdk-athena = "1"
aws-sdk-backup = "1"
aws-sdk-autoscaling = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-codebuild = "1"
aws-sdk-codedeploy = "1"
aws-sdk-appconfig = "1"
aws-sdk-appconfigdata = "1"
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-dynamodb = "1"
aws-sdk-dynamodbstreams = "1"
aws-sdk-ec2 = "1"
aws-sdk-ecr = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-elasticache = "1"
aws-sdk-cloudformation = "1"
aws-sdk-eventbridge = "1"
aws-sdk-firehose = "1"
aws-sdk-glue = "1"
aws-sdk-iam = "1"
aws-sdk-kafka = "1"
aws-sdk-kinesis = "1"
aws-sdk-kms = "1"
aws-sdk-lambda = "1"
aws-sdk-opensearch = "1"
aws-sdk-rds = "1"
aws-sdk-route53 = "1"
aws-sdk-s3 = "1"
aws-sdk-scheduler = "1"
aws-sdk-ses = "1"
aws-sdk-sesv2 = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sfn = "1"
aws-sdk-sns = "1"
aws-sdk-sqs = "1"
aws-sdk-ssm = "1"
aws-sdk-sts = "1"
aws-sdk-transfer = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
url = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
