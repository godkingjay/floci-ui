name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tailwind:build
      - name: Clean Node artifacts
        run: rm -rf node_modules
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo clippy --target wasm32-unknown-unknown --all-features
      - name: Clean frontend cargo artifacts
        run: cargo clean
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            wget
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Clean Tauri cargo artifacts before tests
        run: cargo clean --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --lib --bins
      - name: Run Tauri integration tests
        run: |
          if find src-tauri/tests -type f -name '*.rs' -print -quit 2>/dev/null | grep -q .; then
            cargo test --manifest-path src-tauri/Cargo.toml --all-features --tests
          fi
