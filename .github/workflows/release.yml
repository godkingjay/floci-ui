name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.2. Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+ ]]; then
            echo "::error::Release tag must start with v, for example v0.1.2."
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(grep -m1 '"version":' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')"
          root_cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tauri_cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          tauri_config_version="$(grep -m1 '"version":' src-tauri/tauri.conf.json | sed -E 's/.*"version": "([^"]+)".*/\1/')"

          if [[ "$tauri_config_version" != "../package.json" ]]; then
            echo "::error::src-tauri/tauri.conf.json must read version from ../package.json."
            exit 1
          fi

          for version_entry in \
            "package.json=$package_version" \
            "Cargo.toml=$root_cargo_version" \
            "src-tauri/Cargo.toml=$tauri_cargo_version"; do
            version_file="${version_entry%%=*}"
            version_value="${version_entry#*=}"

            if [[ "$version_value" != "$expected_version" ]]; then
              echo "::error::$version_file version $version_value does not match release tag $RELEASE_TAG."
              exit 1
            fi
          done

  build:
    name: Build ${{ matrix.name }} bundle
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install Tauri Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            rpm \
            wget
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Floci UI ${{ env.RELEASE_TAG }}
          releaseDraft: true
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          tauriScript: cargo tauri
