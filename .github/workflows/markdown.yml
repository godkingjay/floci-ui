name: Markdown

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "README.md" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md" "SECURITY.md" "SUPPORT.md" "CHANGELOG.md" "docs/**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md CHANGELOG.md docs/**/*.md
