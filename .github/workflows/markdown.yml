name: Markdown

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect Markdown changes
        id: markdown_changes
        shell: bash
        run: |
          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --diff-filter=AMR HEAD^1 HEAD > changed-files.txt

          if grep -Eiq '\.md$' changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Markdown changes
        if: steps.markdown_changes.outputs.changed != 'true'
        run: echo "No added or modified Markdown files found; skipping Markdown checks."

      - name: Setup Node.js
        if: steps.markdown_changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Markdown lint
        if: steps.markdown_changes.outputs.changed == 'true'
        run: npx --yes markdownlint-cli2 "README.md" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md" "SECURITY.md" "SUPPORT.md" "CHANGELOG.md" "docs/**/*.md"

      - name: Link check
        if: steps.markdown_changes.outputs.changed == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md CHANGELOG.md docs/**/*.md
