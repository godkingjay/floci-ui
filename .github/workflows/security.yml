name: Security

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_AUDIT_IGNORES: >-
        --ignore RUSTSEC-2024-0370
        --ignore RUSTSEC-2024-0411
        --ignore RUSTSEC-2024-0412
        --ignore RUSTSEC-2024-0413
        --ignore RUSTSEC-2024-0414
        --ignore RUSTSEC-2024-0415
        --ignore RUSTSEC-2024-0416
        --ignore RUSTSEC-2024-0417
        --ignore RUSTSEC-2024-0418
        --ignore RUSTSEC-2024-0419
        --ignore RUSTSEC-2024-0420
        --ignore RUSTSEC-2024-0429
        --ignore RUSTSEC-2024-0436
        --ignore RUSTSEC-2025-0052
        --ignore RUSTSEC-2025-0075
        --ignore RUSTSEC-2025-0080
        --ignore RUSTSEC-2025-0081
        --ignore RUSTSEC-2025-0098
        --ignore RUSTSEC-2025-0100
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect dependency policy changes
        id: dependency_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only HEAD^1 HEAD > changed-files.txt
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git ls-tree -r --name-only HEAD > changed-files.txt
          else
            git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" > changed-files.txt
          fi

          if grep -Eq '^(Cargo\.toml|Cargo\.lock|src-tauri/Cargo\.toml|src-tauri/Cargo\.lock|deny\.toml|package\.json|package-lock\.json|\.github/workflows/security\.yml)$' changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust 1.95
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install Rust security tools
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Rust dependency policy
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          cargo deny check advisories bans licenses sources
          cargo deny --manifest-path src-tauri/Cargo.toml check advisories bans licenses sources

      - name: Rust advisories
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          cargo audit --file Cargo.lock $CARGO_AUDIT_IGNORES
          cargo audit --file src-tauri/Cargo.lock $CARGO_AUDIT_IGNORES

      - name: npm audit
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
